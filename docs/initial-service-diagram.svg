<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
  <title id="title">HBntory delivered service architecture</title>
  <desc id="description">Internal and public browsers both reach the single Backoffice service directly, with no API Gateway. The Backoffice reads and writes SQLite and calls the external Product API. The Product MCP Server is independent, also calls the external Product API, but has no consumer in this project since the AI Query Service was excluded from scope.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 13px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { font: 600 12px Arial, sans-serif; fill: #334155; }
      .edge-muted { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-muted); }
      .edge-label-muted { font: 600 12px Arial, sans-serif; fill: #64748b; }
      .excluded-title { font: 700 15px Arial, sans-serif; fill: #64748b; }
      .excluded-text { font: 13px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1000" height="640" fill="#f8fafc"/>
  <text x="50" y="46" class="title">HBntory — Delivered Service Architecture</text>
  <text x="50" y="70" class="subtitle">No API Gateway, no AI Query Service — both excluded from the final scope.</text>

  <!-- Internal browser -->
  <rect x="60" y="110" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="140" class="box-title" text-anchor="middle">Internal Browser</text>
  <text x="170" y="162" class="box-text" text-anchor="middle">admin / common user</text>

  <!-- Public browser -->
  <rect x="720" y="110" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="140" class="box-title" text-anchor="middle">Public Browser</text>
  <text x="830" y="162" class="box-text" text-anchor="middle">anonymous visitor</text>

  <!-- Backoffice service (wide, center) -->
  <rect x="260" y="250" width="480" height="110" rx="10" fill="#e5f1fa" stroke="#246da8" stroke-width="2"/>
  <text x="500" y="285" class="box-title" text-anchor="middle">Backoffice Service (FastAPI)</text>
  <text x="500" y="308" class="box-text" text-anchor="middle">Serves authenticated pages (/login, /stock, /users)</text>
  <text x="500" y="326" class="box-text" text-anchor="middle">and the public catalogue page (/) — same app, no gateway</text>
  <text x="500" y="344" class="box-text" text-anchor="middle">product_client.py used by both authenticated and public endpoints</text>

  <!-- SQLite -->
  <rect x="150" y="450" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="480" class="box-title" text-anchor="middle">SQLite</text>
  <text x="260" y="502" class="box-text" text-anchor="middle">users, branches, stocks</text>

  <!-- External Product API -->
  <rect x="620" y="450" width="240" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="740" y="480" class="box-title" text-anchor="middle">External Product API</text>
  <text x="740" y="502" class="box-text" text-anchor="middle">supplied, read-only</text>

  <!-- Product MCP Server (offset, muted) -->
  <rect x="620" y="560" width="240" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="587" class="excluded-title" text-anchor="middle">Product MCP Server</text>
  <text x="740" y="606" class="excluded-text" text-anchor="middle">independent — no consumer in this project</text>

  <!-- Edges -->
  <path d="M170,180 L170,220 Q170,250 260,270" class="edge"/>
  <text x="130" y="215" class="edge-label">REST + session cookie</text>

  <path d="M830,180 L830,220 Q830,250 740,270" class="edge"/>
  <text x="700" y="215" class="edge-label" text-anchor="end">REST, anonymous</text>

  <path d="M400,360 L300,450" class="edge"/>
  <text x="320" y="415" class="edge-label">SQLAlchemy</text>

  <path d="M600,360 L700,450" class="edge"/>
  <text x="660" y="415" class="edge-label">read-only REST</text>

  <path d="M740,520 L740,560" class="edge-muted"/>
  <text x="750" y="545" class="edge-label-muted">read-only REST</text>
</svg>
